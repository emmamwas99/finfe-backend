services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true&replicaSet=rs0
      MONGODB_DATABASE: finfe
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-this-secret-before-deploying
      REQUIRE_EMAIL_VERIFICATION: "true"
      MAIL_DRIVER: log
      BILLING_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  mongo_data:
