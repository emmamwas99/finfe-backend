services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finfe
      POSTGRES_PASSWORD: finfe
      POSTGRES_DB: finfe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finfe -d finfe"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://finfe:finfe@postgres:5432/finfe?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-this-secret-before-deploying
      MIGRATE_ON_START: "true"
      REQUIRE_EMAIL_VERIFICATION: "true"
      MAIL_DRIVER: log
      BILLING_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
